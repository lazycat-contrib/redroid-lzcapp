version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/redroid.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: redroid
    bump: patch
build:
  run_buildscript: false
images:
  # redroid 上游用 <major.minor.patch>-<yyMMdd> 日期家族（immutable），跟随 16.0.0-* 最新日期构建
  - id: redroid
    target: service
    service: redroid
    source: redroid/redroid
    channel: custom
    sort: semver
    tag_regex: '^16\.0\.0-\d{6}$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ReDroid
    summary: "GPU 加速的 Android 云方案 (AIC)，支持云游戏、虚拟手机、自动化测试等场景"
